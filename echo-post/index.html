<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f0e7"><title>回声邮局 II · 指令与包裹</title><link rel="stylesheet" href="style.css"></head>
<body><div class="shell"><header><a class="brand" href="./" aria-label="回声邮局首页"><span class="brand-stamp"><svg width="30" height="23" viewBox="0 0 30 23" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="1" y="1" width="28" height="21" rx="1"/><path d="m2 2 13 11L28 2M2 21l9-9m17 9-9-9"/></svg></span><span>ECHO POST <small>II</small></span><i class="postmark">〰</i></a><div class="header-line"></div><nav><button id="sound" aria-label="开启声音">声音 关</button><button id="help">玩法 ?</button><button id="restart">↻ 重来 <kbd>R</kbd></button></nav></header>
<main><aside><div class="title-wrap"><h1>回声<br>邮局<span class="title-seal">时光<br>投递</span></h1><p class="tagline">和昨天合作，把不可能送达。</p></div><div class="small-line"></div><div class="chapter"><span id="level-number">CASE 01 / 08</span><h2 id="level-name"></h2></div><p id="story" class="story"></p><div id="challenge" class="challenge"></div><div class="mission"><span class="mission-label">本次投递</span><p id="mission"></p></div><div id="echo-list" class="echo-list"></div><div class="actions"><button id="echo" class="primary">留下回声 <kbd>Space</kbd></button><div class="minor-actions"><button id="undo">↶ 撤销 <kbd>Z</kbd></button><button id="wait">◷ 等待 <kbd>E</kbd></button></div><div class="minor-actions"><button id="retry">重试本轮 <kbd>F</kbd></button><button id="remove">删除回声 <kbd>Q</kbd></button></div></div><button id="hint" class="hint">展开提示 1 / 3 ↗</button><p id="hint-text" class="hint-text" hidden></p><div class="level-selector" id="levels" aria-label="选择关卡"></div></aside>
<section class="play-area"><div class="board-top"><span><i class="live-dot"></i> <span id="status">投递进行中</span></span><span id="stamp-count">纪念邮票 0 / 1</span></div><div class="board-wrap"><canvas id="board" width="1100" height="700" role="img" aria-label="回声邮局机关地图，使用方向键移动"></canvas><div id="toast" role="status"></div><div class="board-corner">E.P. / 时光投递处</div></div><div class="timeline"><div class="timeline-label">回声时间轴<small id="step-count">第 00 步</small></div><div class="timeline-track"><div id="ticks"></div><div class="timeline-caption"><span>● 本回合</span><span>回声先动，你再动 · 撞墙也记一步</span><span>下一步 →</span></div></div></div><div class="legend"><span><i class="legend-dot courier"></i>现在的你</span><span><i class="legend-dot ghost"></i>过去的你</span><span><i class="legend-dot plate"></i>同字母机关需全部压住</span><span>▣ 箱子也能压机关</span></div><div class="touch-controls" aria-label="触屏方向控制"><button data-move="0,-1" aria-label="向上">↑</button><div><button data-move="-1,0" aria-label="向左">←</button><button data-move="0,1" aria-label="向下">↓</button><button data-move="1,0" aria-label="向右">→</button></div></div></section></main>
<footer><span>同一串指令，不同的结果。</span><div><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> / WASD 移动 <b>·</b> <kbd>Space</kbd> 留下回声 <b>·</b> <kbd>E</kbd> 等待</div><span id="progress">已解决 0 / 8</span></footer></div>
<dialog id="modal"><button id="close-modal" aria-label="关闭弹窗">×</button><div id="modal-content"></div></dialog><script src="engine.js"></script><script src="levels.js"></script><script src="game.js"></script></body></html>
